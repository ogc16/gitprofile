name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with vite
        run: pnpm run build
        env:
          NODE_ENV: production
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify dist directory
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory not found after build!"
            ls -la
            exit 1
          fi
          echo "Build successful. Contents:"
          ls -la dist/

      - name: Deploy build to live branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin new
          git checkout new

          ls assets 2>/dev/null || true
          if ls assets/main-*.js >/dev/null 2>&1; then
            rm -f assets/main-*.js assets/main-*.css
          fi
          find assets -type f ! -name 'main-*.js' ! -name 'main-*.css' -delete 2>/dev/null || true

          cp -rf dist/* .
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi

          git commit -m "Deploy from main $GITHUB_SHA"
          git push origin new